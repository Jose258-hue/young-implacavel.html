<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Young Implacável — Organize your life. Build yourself. Take action.</title>
<meta name="description" content="SaaS de crescimento pessoal e produtividade: metas, hábitos, foco, estudo, carreira, rendimento e IA.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<meta name="theme-color" content="#0a0c11">
<style>
:root{
  --bg:#0a0c11; --bg2:#0f131b; --panel:#141924; --panel2:#1a2030; --line:#252d3d;
  --txt:#eaedf5; --muted:#8b95ab; --dim:#5f6a80;
  --acc:#ff6b2c; --acc2:#ffb02e; --acc3:#ff3d6e;
  --ok:#2fd07a; --warn:#ffc93c; --bad:#ff5b6e; --info:#4aa8ff;
  --r:16px; --grad:linear-gradient(135deg,#ff6b2c,#ffb02e); --grad2:linear-gradient(135deg,#ff3d6e,#ff6b2c);
  --sh:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,sans-serif;
  background:var(--bg);color:var(--txt);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(700px 420px at 12% -8%, rgba(255,107,44,.16), transparent 62%),
    radial-gradient(600px 380px at 92% 4%, rgba(255,61,110,.10), transparent 60%),
    radial-gradient(700px 500px at 60% 110%, rgba(74,168,255,.07), transparent 65%);
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2a3448;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
#landing,#onboard,#app{position:relative;z-index:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600;font-size:14px;transition:.16s}
.btn:hover{transform:translateY(-1px);background:#212a3d}
.btn.primary{background:var(--grad);border:0;color:#160b03;box-shadow:0 6px 20px rgba(255,107,44,.32)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
.btn.block{width:100%}
.btn.danger{color:var(--bad);border-color:#4a2230}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.card{background:linear-gradient(180deg,var(--panel),#111621);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative}
.card.pad{padding:20px}
.grid{display:grid;gap:16px}
.row{display:flex;gap:12px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.between{display:flex;gap:12px;align-items:center;justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.small{font-size:12.5px}.tiny{font-size:11.5px}
.bold{font-weight:700}.center{text-align:center}
h1,h2,h3{line-height:1.2}
h1{font-size:26px}h2{font-size:19px}h3{font-size:15.5px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.3px;background:#212a3d;border:1px solid var(--line)}
.badge.pro{background:var(--grad);color:#160b03;border:0}
.badge.ok{background:rgba(47,208,122,.12);color:var(--ok);border-color:rgba(47,208,122,.3)}
.badge.warn{background:rgba(255,201,60,.12);color:var(--warn);border-color:rgba(255,201,60,.3)}
.badge.bad{background:rgba(255,91,110,.12);color:var(--bad);border-color:rgba(255,91,110,.3)}
label.fld{display:block;margin-bottom:12px}
label.fld>span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.3px;text-transform:uppercase}
input,select,textarea{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:#0e1219;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,107,44,.14)}
textarea{resize:vertical;min-height:88px}
input[type=range]{padding:0;background:transparent}
.bar{height:9px;border-radius:999px;background:#1d2434;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--grad);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.blue>i{background:linear-gradient(90deg,#4aa8ff,#7b6bff)}
.bar.green>i{background:linear-gradient(90deg,#2fd07a,#7ce0aa)}
.bar.pink>i{background:var(--grad2)}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;transition:.15s}
.chip:hover{border-color:#3a4762}
.chip.on{background:var(--grad);color:#160b03;border-color:transparent}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.scroller::-webkit-scrollbar{height:6px}
.divider{height:1px;background:var(--line);margin:16px 0}
.lock{position:absolute;inset:0;border-radius:var(--r);background:rgba(8,10,15,.82);backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:5}

/* language switcher */
.langsw{display:inline-flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px}
.langsw button{background:none;border:0;padding:5px 11px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);transition:.15s}
.langsw button:hover{color:var(--txt)}
.langsw button.on{background:var(--grad);color:#160b03}

/* landing */
.nav{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 28px;max-width:1180px;margin:0 auto;width:100%}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.4px;font-size:18px}
.logo .fl{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-size:20px;box-shadow:0 6px 18px rgba(255,107,44,.4)}
.hero{max-width:1180px;margin:0 auto;width:100%;padding:40px 28px 30px;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(31px,4.4vw,52px);letter-spacing:-1.4px;margin:14px 0 16px}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{color:var(--muted);font-size:17px;max-width:520px;margin-bottom:26px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:26px;margin-top:30px;flex-wrap:wrap}
.stats b{display:block;font-size:22px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.preview{background:linear-gradient(180deg,#151b27,#0e1219);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--sh);transform:perspective(1400px) rotateY(-7deg) rotateX(3deg)}
.pmini{display:grid;gap:10px}
.pcard{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px}
.features{max-width:1180px;margin:0 auto;width:100%;padding:30px 28px 10px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:.2s}
.fcard:hover{transform:translateY(-3px);border-color:#3a4762}
.fcard .ico{font-size:24px;margin-bottom:10px;display:block}
.pricing{max-width:1000px;margin:0 auto;width:100%;padding:34px 28px 70px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:810px;margin:0 auto}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;position:relative}
.plan.hot{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 20px 50px rgba(255,107,44,.16)}
.plan .price{font-size:36px;font-weight:800;letter-spacing:-1.5px;margin:10px 0 4px}
.plan ul{list-style:none;margin:18px 0;display:grid;gap:9px}
.plan li{display:flex;gap:9px;font-size:14px;color:var(--muted)}
.plan li i{color:var(--ok);font-style:normal}
footer{border-top:1px solid var(--line);padding:24px 28px;text-align:center;color:var(--dim);font-size:13px}

/* onboarding */
.obwrap{display:none;position:fixed;inset:0;z-index:180;background:rgba(5,7,11,.88);backdrop-filter:blur(9px);align-items:center;justify-content:center;padding:18px}
.obwrap.on{display:flex}
.ob{background:linear-gradient(180deg,var(--panel),#111621);border:1px solid var(--line);border-radius:22px;width:100%;max-width:620px;padding:30px;box-shadow:var(--sh);max-height:92vh;overflow-y:auto}
.obsteps{display:flex;gap:6px;margin-bottom:22px}
.obsteps i{flex:1;height:5px;border-radius:99px;background:#222b3d;transition:.3s}
.obsteps i.on{background:var(--grad)}
.obstep{display:none;animation:fade .3s ease}
.obstep.on{display:block}
.obstep .big{font-size:44px;margin-bottom:12px;display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.obnav{display:flex;gap:10px;justify-content:space-between;margin-top:24px}
.langcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:8px}
.langcard{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;text-align:center;transition:.15s}
.langcard:hover{border-color:#3a4762;transform:translateY(-2px)}
.langcard.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.langcard b{display:block;font-size:15px}
.langcard span{font-size:11.5px;color:var(--muted)}

/* app shell */
#app{display:none;min-height:100vh}
.shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#0f131b,#0b0e14);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.side .brand{padding:4px 10px 16px}
.navitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;transition:.14s;border:1px solid transparent}
.navitem:hover{background:#161d2b;color:var(--txt)}
.navitem.on{background:linear-gradient(90deg,rgba(255,107,44,.16),rgba(255,107,44,.03));color:var(--txt);border-color:rgba(255,107,44,.28)}
.navitem .ic{width:22px;text-align:center;font-size:16px}
.navitem .tag{margin-left:auto;font-size:10px;padding:2px 7px;border-radius:999px;background:var(--grad);color:#160b03;font-weight:800}
.navsep{height:1px;background:var(--line);margin:10px 6px}
.main{padding:26px 30px 90px;max-width:1080px;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.xpbox{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 14px}
.lvl{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-size:19px}
.view{animation:fade .28s ease}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.sechead p{color:var(--muted);font-size:14px;margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:linear-gradient(180deg,var(--panel),#111621);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.kpi .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.8px;margin:6px 0 2px}
.hero-card{background:linear-gradient(120deg,rgba(255,107,44,.15),rgba(255,61,110,.07) 55%,transparent);border:1px solid rgba(255,107,44,.28);border-radius:20px;padding:24px;margin-bottom:18px}
.hero-card h2{font-size:23px;letter-spacing:-.6px}
.quote{font-style:italic;color:var(--muted);margin-top:8px;font-size:15px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.list{display:grid;gap:9px}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);transition:.15s}
.item:hover{border-color:#3a4762}
.item.done{opacity:.55}
.item.done .txt{text-decoration:line-through}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid #3a4762;display:grid;place-items:center;cursor:pointer;flex:none;transition:.15s;font-size:13px;color:transparent}
.chk.on{background:var(--grad);border-color:transparent;color:#160b03}
.del{margin-left:auto;background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:8px}
.del:hover{color:var(--bad);background:rgba(255,91,110,.1)}
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:280px}
.day{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:#161d2b;cursor:pointer;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--dim);transition:.14s}
.day.on{background:var(--grad);border-color:transparent;color:#160b03}
.timer{text-align:center;padding:8px 0}
.timer .big{font-size:clamp(52px,12vw,86px);font-weight:800;letter-spacing:-3px;font-variant-numeric:tabular-nums;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.dial{width:230px;height:230px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;position:relative}
.dial::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--line)}
.chat{display:flex;flex-direction:column;gap:12px;max-height:52vh;overflow-y:auto;padding-right:6px;margin-bottom:14px}
.msg{max-width:86%;padding:12px 15px;border-radius:15px;font-size:14.5px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--grad);color:#160b03;border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:5px}
.lb{display:grid;gap:8px}
.lbrow{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.lbrow.me{border-color:var(--acc);background:linear-gradient(90deg,rgba(255,107,44,.14),transparent)}
.rank{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;background:#222b3d;font-size:13px}
.rank.g1{background:linear-gradient(135deg,#ffd76e,#ff9d2e);color:#3a2400}
.rank.g2{background:linear-gradient(135deg,#e2e8f5,#aab6cf);color:#20293c}
.rank.g3{background:linear-gradient(135deg,#e8a86a,#c47a3c);color:#2e1700}
.n{width:36px;height:36px;border-radius:11px;background:#212a3d;display:grid;place-items:center;flex:none;font-size:18px}
.cv{background:#fff;color:#111;border-radius:14px;padding:26px;font-size:13px}
.cv h1{font-size:25px;color:#111;margin-bottom:3px}
.cv h3{font-size:11.5px;text-transform:uppercase;letter-spacing:1.2px;color:#ff6b2c;border-bottom:1px solid #ddd;padding-bottom:4px;margin:16px 0 8px}
.cv p,.cv li{color:#333}
.cv ul{padding-left:18px}
.toastwrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:12px 17px;box-shadow:var(--sh);font-size:14px;font-weight:600;animation:slide .3s ease;max-width:330px}
@keyframes slide{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.modalwrap{position:fixed;inset:0;background:rgba(5,7,11,.75);backdrop-filter:blur(6px);z-index:150;display:none;align-items:center;justify-content:center;padding:20px}
.modalwrap.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;max-width:540px;width:100%;box-shadow:var(--sh);max-height:90vh;overflow-y:auto}
.mobilebar{display:none}
.metric{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:7px}
.metric b{font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.cal .t{padding:9px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);text-align:center;font-size:11.5px;color:var(--muted)}
.cal .t b{display:block;font-size:14px;color:var(--txt);margin-bottom:2px}
.secdot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px;box-shadow:0 0 8px var(--ok)}
@media(max-width:960px){.hero{grid-template-columns:1fr;gap:30px;padding-top:20px}.preview{transform:none}.pgrid{grid-template-columns:1fr}.cols2{grid-template-columns:1fr}}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}.side{display:none}
  .main{padding:18px 16px 110px}
  .mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:120;background:rgba(15,19,27,.96);border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}
  .mobilebar .mi{flex:1;text-align:center;padding:7px 2px;border-radius:11px;cursor:pointer;color:var(--muted);font-size:10px;font-weight:700}
  .mobilebar .mi.on{color:var(--acc);background:rgba(255,107,44,.1)}
  .mobilebar .mi span{display:block;font-size:18px;margin-bottom:2px}
  .toastwrap{bottom:96px;right:14px;left:14px;align-items:stretch}
  .nav{padding:14px 16px}.ob{padding:22px}
}
@media print{.side,.topbar,.mobilebar,.toastwrap,.modalwrap{display:none!important}body{background:#fff}.cv{box-shadow:none}}
</style>
</head>
<body>

<div id="landing"></div>
<div id="onboard" class="obwrap"></div>

<div id="app">
  <div class="shell">
    <aside class="side">
      <div class="brand logo"><span class="fl">🔥</span> <span id="brandName">Young Implacável</span></div>
      <div id="sideNav"></div>
      <div style="flex:1"></div>
      <div class="navsep"></div>
      <div id="sideLang" style="padding:6px 10px 10px"></div>
      <div class="navitem" onclick="openPricing()"><span class="ic">💎</span> <span id="navUpgrade"></span></div>
      <div class="navitem" onclick="logout()"><span class="ic">↩︎</span> <span id="navLogout"></span></div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div>
          <div class="small muted bold" id="crumb">—</div>
          <h1 id="viewTitle">—</h1>
        </div>
        <div class="row" style="gap:10px">
          <div class="xpbox">
            <div class="lvl" id="lvlIcon">🥉</div>
            <div><div class="tiny bold" id="lvlName">—</div><div class="tiny muted" id="xpText">—</div></div>
          </div>
          <button class="btn sm" onclick="openModal('help')">?</button>
        </div>
      </div>
      <div id="view" class="view"></div>
    </main>
  </div>
  <div class="mobilebar" id="mobileBar"></div>
</div>

<div class="toastwrap" id="toasts"></div>
<div class="modalwrap" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalBody"></div></div>

<script>
/* ==========================================================================
   YOUNG IMPLACÁVEL — SPA i18n  (pt · en · es · fr)
   ========================================================================== */
const I18N={
pt:{
'meta.title':'Young Implacável — Organize a tua vida. Constrói-te. Toma ação.',
'meta.desc':'Plataforma de crescimento pessoal e produtividade: metas, hábitos, foco, estudo, carreira, rendimento e IA.',
/* landing */
'l.badge':'🚀 Para jovens que querem evoluir',
'l.h1a':'Organize a tua vida.',
'l.h1b':'Constrói-te a ti mesmo.',
'l.lead':'Uma plataforma completa de crescimento pessoal e produtividade: metas, hábitos, foco, estudo, carreira, rendimento e a tua assistente IA — IMPA.',
'l.cta1':'Começar agora — é grátis',
'l.cta2':'Ver planos',

function finishOnboarding(){

  sc.name=(OB.name||'').trim()||'Jovem'; sc.area=(OB.city||'').trim();
  const titles={academico:{pt:'Dominar uma matéria',en:'Master a subject',es:'Dominar una materia',fr:'Maîtriser une matière'},
                carreira:{pt:'Conseguir um emprego',en:'Get a job',es:'Conseguir empleo',fr:'Trouver un emploi'},
                financeiro:{pt:'Aumentar o rendimento',en:'Increase my income',es:'Aumentar mis ingresos',fr:'Augmenter mes revenus'},
                pessoal:{pt:'Construir disciplina',en:'Build discipline',es:'Construir disciplina',fr:'Construire ma discipline'}};
  sc.goals=[{id:uid(),cat:OB.cat,title:titles[OB.cat],why:'',progress:0,created:today()}];

                3:{pt:'Estudar 1 hora',en:'Study for 1 hour',es:'Estudiar 1 hora',fr:'Étudier 1 heure'},4:{pt:'Exercitar 20 minutos',en:'Exercise for 20 minutes',es:'Ejercicio 20 minutos',fr:'Sport 20 minutes'}};

function dailyChallenge(){
  const idx=new Date().getDate()%CHALLENGES.length, c=CHALLENGES[idx];
  const task=c[1]?t('ch.'+c.id+'.1'):t('ch.'+c.id+'.1');
  const key='dc_'+today(); const done=localStorage.getItem(key)==='1';
  const tdef=c.tasks?c.tasks[0]:t('ch.'+c.id+'.1');
  const tt=t('ch.'+c.id+'.'+((new Date().getDate()%3)+1));
  return `<div class="item" style="align-items:flex-start"><div class="chk ${done?'on':''}" onclick="claimDaily('${key}')">✓</div>
    <div class="grow"><div class="bold small">${c.ic} ${tt}</div>
    <div class="tiny muted" style="margin-top:3px">${t('h.challengeWord')}: ${t('ch.'+c.id+'.n')} · ${t('h.worthXp',{x:XP.challenge})}</div></div></div>
    <p class="tiny dim" style="margin-top:10px">${t('h.challengeNote')}</p>`;
}
function claimDaily(key){ if(localStorage.getItem(key)==='1') return; localStorage.setItem(key,'1'); addXP(XP.challenge,'x.daily'); persist(); }
function toggleTask(id){ const x=S.tasks.find(v=>v.id===id); if(!x) return; x.done=!x.done; if(x.done) addXP(XP.task,'x.task'); else S.xp=Math.max(0,S.xp-XP.task); persist(); }
function addTask(){ const i=$('#newTask'); if(!i||!i.value.trim()) return; S.tasks.unshift({id:uid(),title:i.value.trim(),xp:XP.task,done:false,date:today()}); persist(); }
function delTask(id){ S.tasks=S.tasks.filter(x=>x.id!==id); persist(); }
function toggleHabit(id){ const h=S.habits.find(x=>x.id===id); if(!h) return; h.days=h.days||[]; const td=today(); if(h.days.includes(td)){h.days=h.days.filter(d=>d!==td);S.xp=Math.max(0,S.xp-XP.habit);} else {h.days.push(td);addXP(XP.habit,'x.habit');} persist(); }
function streakOf(h){ let n=0; const d=new Date(); for(let i=0;i<400;i++){ const k=new Date(d); k.setDate(d.getDate()-i); if((h.days||[]).includes(k.toISOString().slice(0,10))) n++; else if(i>0) break; } return n; }
function editFin(){ const g=prompt(t('h.finGoal'),S.finGoal||10000); if(g===null) return; S.finGoal=Math.max(0,Number(g)||0); persist(); }
function addSaving(){ const i=$('#finAdd'); const v=Number(i&&i.value); if(!v) return; S.finSaved+=v; addXP(5,'x.saving'); persist(); }

function mmss(s){const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');}
function pickFocus(m){ F.mode=m; F.left=m*60; F.running=false; clearInterval(timer); timer=null; renderView(); }
function mountFocus(){ const c=$('#clock'); if(c) c.textContent=mmss(F.left); const d=$('#dial'); if(d) d.style.background=`conic-gradient(#ff6b2c ${(1-F.left/(F.mode*60))*360}deg, transparent 0deg)`; const b=$('#fBtn'); if(b) b.textContent=F.running?t('fo.pause'):t('fo.start'); }
function toggleFocus(){
  if(F.running){ clearInterval(timer); timer=null; F.running=false; }
  else{ F.running=true; timer=setInterval(()=>{ F.left--; mountFocus();
    if(F.left<=0){ clearInterval(timer); timer=null; F.running=false; F.left=F.mode*60; S.focusToday++; S.focusLog.push({date:today(),min:F.mode}); S.xp+=XP.focus; toast(t('t.sessionDone',{x:XP.focus})); save(); renderView(); } },1000); }
  mountFocus();
}
function resetFocus(){ clearInterval(timer); timer=null; F.running=false; F.left=F.mode*60; mountFocus(); }

function evalAnswer(){
  const a=($('#ansInput')&&$('#ansInput').value||'').trim();
  if(a.length<15){ toast(t('c.tipMore')); return; }
  const words=a.split(/\s+/).length, hasN=/\d/.test(a);
  const hasEx=/(exemplo|example|ejemplo|exemple|quando|when|cuando|quand|project|projeto|proyecto)/i.test(a);
  const hasSt=/(primeiro|because|porque|parce que|therefore|portanto|então|entonces|donc|primeiro|first|primero|d'abord)/i.test(a);
  const fp=/\b(eu|fiz|aprendi|consigo|sou|i |my |me |yo |je |j'ai)\b/i.test(a);
  const sc={clarity:Math.min(100,Math.round(Math.max(30,100-Math.abs(words-110)*0.5))),structure:hasSt?85:(hasEx?68:48),confidence:fp?85:55,relevance:(hasN||hasEx)?88:60};
  const avg=Math.round(Object.values(sc).reduce((x,y)=>x+y,0)/4);
  const tips=[];
  if(words<60) tips.push(t('c.tipShort')); if(words>220) tips.push(t('c.tipLong'));
  if(!hasSt) tips.push(t('c.tipStructure')); if(!hasEx) tips.push(t('c.tipExample'));
  if(!hasN) tips.push(t('c.tipNumber')); if(!fp) tips.push(t('c.tipFirst'));
  if(!tips.length) tips.push(t('c.tipGreat'));
  const K={clarity:'c.clarity',structure:'c.structure',confidence:'c.confidence',relevance:'c.relevance'};
  $('#fb').innerHTML=`<div class="card" style="background:var(--panel2)">
    <div class="between"><b>${t('c.global')}</b><span class="badge ${avg>=75?'ok':avg>=55?'warn':'bad'}">${avg}/100</span></div><div class="divider"></div>
    ${Object.entries(sc).map(([k,v])=>`<div style="margin-bottom:9px"><div class="between small"><span>${t(K[k])}</span><b>${v}%</b></div><div class="bar" style="margin-top:5px"><i style="width:${v}%"></i></div></div>`).join('')}
    <div class="divider"></div><div class="tiny muted bold" style="margin-bottom:6px">${t('c.feedback')}</div>
    <ul style="padding-left:18px" class="small">${tips.map(x=>`<li style="margin-bottom:4px">${x}</li>`).join('')}</ul></div>`;
  addXP(10,'x.interview'); save();
}

function mountImpa(){ const c=$('#chat'); if(c) c.scrollTop=c.scrollHeight; }
function quickImpa(el){ $('#impaInput').value=el.textContent; askImpa(); }
function buildPlan(p,n){
  const steps=[]; for(let i=1;i<=n;i++) steps.push('• '+t('ip.'+p+'.'+i));
  return t('ip.plan')+': '+t('ip.'+p+'.t')+'\n\n'+steps.join('\n')+'\n\n'+t('ip.'+p+'.n');
}
function impaAnswer(q){
  const s=q.toLowerCase();
  for(const r of IMPA){ if(r.k.some(k=>s.includes(k))){
    if(r.p==='biz'){ const m=q.match(/(\d[\d\s.,]{2,})/); const plan=buildPlan('biz',r.n); return m?plan+'\n\n'+t('ip.biz.mt',{v:m[1].trim()}):plan; }
    return buildPlan(r.p,r.n);
  }}
  return t('ip.gen.body');
}
function askImpa(){
  const i=$('#impaInput'); const q=(i&&i.value||'').trim(); if(!q) return;
  S.chat.push({r:'me',t:q}); S.chat.push({r:'ai',t:impaAnswer(q)});
  if(S.chat.length>40) S.chat=S.chat.slice(-40);
  save(); i.value='';
  const c=$('#chat'); c.innerHTML=S.chat.map(m=>`<div class="msg ${m.r}">${esc(m.t)}</div>`).join(''); c.scrollTop=c.scrollHeight;
  addXP(2,'x.impa'); save();
}

/* ===================== CHALLENGES ===================== */
function vChallenges(){
  const cur=S.challenge;
  return `<div class="sechead"><div><p>${t('ch.sub')}</p></div></div>
  ${cur?`<div class="card" style="margin-bottom:16px"><div class="between wrap">
      <div><h2>${cur.ic} ${t('ch.'+cur.id+'.n')}</h2><p class="muted small" style="margin-top:4px">${t('ch.day',{a:S.challengeDays,b:cur.d})}</p></div>
      <div class="row"><button class="btn primary" onclick="challengeDay()">${t('ch.mark')}</button><button class="btn ghost" onclick="quitChallenge()">${t('ch.quit')}</button></div></div>
      <div class="bar" style="margin-top:14px"><i style="width:${Math.round(S.challengeDays/cur.d*100)}%"></i></div>
      <div class="divider"></div><div class="list">${[1,2,3].map(i=>`<div class="item small"><div class="chk"></div><div class="txt">${t('ch.'+cur.id+'.'+i)}</div></div>`).join('')}</div></div>`:''}
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">
    ${CHALLENGES.map((c,i)=>{const prem=i>=2&&S.plan!=='pro';return `<div class="card" style="position:relative">
      <div class="between"><span class="badge warn">${t('ch.days',{n:c.d})}</span>${prem?'<span class="badge pro">PRO</span>':''}</div>
      <h3 style="margin:12px 0 4px">${c.ic} ${t('ch.'+c.id+'.n')}</h3>
      <div class="list" style="margin-top:12px">${[1,2,3].map(k=>`<div class="item small"><div class="txt">• ${t('ch.'+c.id+'.'+k)}</div></div>`).join('')}</div>
      <button class="btn ${cur&&cur.id===c.id?'':'primary'} block sm" style="margin-top:14px" onclick="joinChallenge('${c.id}')">${cur&&cur.id===c.id?t('ch.active'):t('ch.enter')}</button>
      ${prem?`<div class="lock"><div style="font-size:26px">💎</div><div class="bold">${t('ch.premT')}</div><button class="btn primary sm" onclick="openPricing()">${t('l.tryPro')}</button></div>`:''}</div>`;}).join('')}
  </div>`;
}
function joinChallenge(id){ const c=CHALLENGES.find(x=>x.id===id); if(!c) return; const idx=CHALLENGES.indexOf(c); if(idx>=2&&S.plan!=='pro'){ openPricing(); return; } S.challenge={id:c.id,d:c.d,ic:c.ic}; S.challengeDays=0; persist(); toast(t('ch.started',{n:t('ch.'+c.id+'.n')})); }
function challengeDay(){ if(!S.challenge) return; S.challengeDays++; if(S.challengeDays>=S.challenge.d){ addXP(XP.challenge,'x.challenge'); toast(t('ch.done',{n:t('ch.'+S.challenge.id+'.n')})); } else addXP(XP.habit,'ch.dayDone'); persist(); }
function quitChallenge(){ S.challenge=null; S.challengeDays=0; persist(); }

/* ===================== COMMUNITY ===================== */
function vCommunity(){
  const board=[{n:'John',x:1240},{n:'Maria',x:1180},{n:'Carlos',x:1050},{n:S.name||t('cm.you'),x:S.xp,me:true},{n:'Amina',x:690},{n:'Bruno',x:540}].sort((a,b)=>b.x-a.x);
  const users=['Maria','John','Carlos','Amina'];
  return `<div class="sechead"><div><p>${t('cm.sub')}</p></div><span class="badge">${t('cm.members',{n:board.length})}</span></div>
  <div class="cols2">
    <div class="card"><div class="between" style="margin-bottom:14px"><h3>${t('cm.rank')}</h3><span class="tiny muted">XP</span></div>
      <div class="lb">${board.map((b,i)=>`<div class="lbrow ${b.me?'me':''}"><div class="rank ${i===0?'g1':i===1?'g2':i===2?'g3':''}">${i+1}</div><div class="grow bold">${esc(b.n)}${b.me?' ('+t('cm.you')+')':''}</div><b>${fmt(b.x)}</b></div>`).join('')}</div></div>
    <div>
      <div class="card" style="margin-bottom:16px"><h3 style="margin-bottom:12px">${t('cm.disc')}</h3>
        <div class="list">${users.map((u,i)=>`<div class="item" style="align-items:flex-start"><div class="lvl" style="width:32px;height:32px;font-size:14px;border-radius:9px">${u[0]}</div><div class="grow"><div class="small"><b>${u}</b></div><div class="small muted">${t('cm.p'+(i+1)+'t')}</div><div class="tiny dim" style="margin-top:5px">❤️ ${[24,18,31,12][i]} · ${t('cm.reply')}</div></div></div>`).join('')}</div></div>
      <div class="card"><h3 style="margin-bottom:10px">${t('cm.ach')}</h3>
        <div class="row wrap"><span class="badge ok">${t('cm.a1')}</span><span class="badge ok">${t('cm.a2')}</span>${S.xp>=700?`<span class="badge ok">${t('cm.a3')}</span>`:''}${S.focusLog.length>=10?`<span class="badge ok">${t('cm.a4')}</span>`:''}${S.goals.some(g=>g.progress>=100)?`<span class="badge ok">${t('cm.a5')}</span>`:''}</div>
        <div class="divider"></div><div class="tiny muted">${t('cm.note')}</div></div>
    </div>
  </div>`;
}

/* ===================== PROGRESS ===================== */
function vProgress(){
  const avgGoal=S.goals.length?Math.round(S.goals.reduce((a,g)=>a+g.progress,0)/S.goals.length):0;
  const habitPct=Math.round(S.habits.reduce((a,h)=>a+(h.days||[]).length,0)/Math.max(1,S.habits.length*7)*100);
  const studyH=Math.round(S.subjects.reduce((a,s)=>a+(s.minutes||0),0)/60*10)/10;
  const LV=levelOf(S.xp);
  const data=[{l:t('p.goals'),v:avgGoal,c:''},{l:t('p.study'),v:Math.min(100,studyH/10*100),c:'blue'},{l:t('p.habits'),v:habitPct,c:'green'},{l:t('p.sessions'),v:Math.min(100,S.focusLog.length/12*100),c:'pink'}];
  return `<div class="sechead"><div><p>${t('p.sub')}</p></div><span class="badge ${LV.pct>=50?'ok':'warn'}">${LV.cur.ic} ${t(LV.cur.k)}</span></div>
  <div class="kpis">
    <div class="kpi"><div class="k">${t('p.goals')}</div><div class="v">${avgGoal}%</div><div class="tiny muted">${t('p.avgProgress')}</div></div>
    <div class="kpi"><div class="k">${t('p.study')}</div><div class="v">${studyH}h</div><div class="tiny muted">${t('p.loggedTime')}</div></div>
    <div class="kpi"><div class="k">${t('p.habits')}</div><div class="v">${habitPct}%</div><div class="tiny muted">${t('p.consistency')}</div></div>
    <div class="kpi"><div class="k">${t('p.sessions')}</div><div class="v">${S.focusLog.length}</div><div class="tiny muted">${t('p.focusBlocks')}</div></div>
    <div class="kpi"><div class="k">${t('p.xp')}</div><div class="v">${fmt(S.xp)}</div><div class="tiny muted">${t('p.total')}</div></div>
  </div>
  <div class="card"><h3 style="margin-bottom:16px">${t('p.perf')}</h3>
    ${data.map(d=>`<div style="margin-bottom:15px"><div class="metric"><span>${d.l}</span><b>${Math.round(d.v)}%</b></div><div class="bar ${d.c}"><i style="width:${Math.min(100,d.v)}%"></i></div></div>`).join('')}
    <div class="divider"></div><p class="center" style="font-style:italic;color:var(--muted)">${t('p.quote')}</p></div>
  <div class="cols2" style="margin-top:16px">
    <div class="card"><h3>${t('p.next')}</h3><div class="list" style="margin-top:12px">${suggestions().map(s=>`<div class="item small"><div class="txt">→ ${s}</div></div>`).join('')}</div></div>
    <div class="card"><h3>${t('p.activity')}</h3><div class="list" style="margin-top:12px">
      <div class="item small"><div class="txt grow">${t('p.focusSessions')}</div><b>${S.focusLog.length}</b></div>
      <div class="item small"><div class="txt grow">${t('p.lessons')}</div><b>${S.lessonsRead.length}</b></div>
      <div class="item small"><div class="txt grow">${t('p.habitsA')}</div><b>${S.habits.length}</b></div>
      <div class="item small"><div class="txt grow">${t('p.subjects')}</div><b>${S.subjects.length}</b></div>
      <div class="item small"><div class="txt grow">${t('p.goalsN')}</div><b>${S.goals.length}</b></div>
    </div></div>
  </div>`;
}
function suggestions(){
  const out=[];
  if(S.goals.length<2) out.push(t('p.s1'));
  if(S.habits.length<3) out.push(t('p.s2'));
  if(S.focusLog.length<3) out.push(t('p.s3'));
  if(!S.lessonsRead.length) out.push(t('p.s4'));
  if(!(S.cv&&S.cv.name)) out.push(t('p.s5'));
  if(!S.subjects.length) out.push(t('p.s6'));
  if(!out.length) out.push(t('p.s7'));
  return out.slice(0,4);
}

/* ===================== SETTINGS ===================== */
function vSettings(){
  return `<div class="sechead"><div><p>${t('se.sub')}</p></div></div>
  <div class="cols2">
    <div class="card"><h3 style="margin-bottom:14px">${t('se.profile')}</h3>
      <label class="fld"><span>${t('se.name')}</span><input id="sName" value="${esc(S.name||'')}"></label>
      <label class="fld"><span>${t('se.city')}</span><input id="sArea" value="${esc(S.area||'')}"></label>
      <label class="fld"><span>${t('se.skill')}</span><input id="sSkill" value="${esc(S.skill||'')}" placeholder="${t('se.skillPh')}"></label>
      <button class="btn primary" onclick="saveProfile()">${t('se.save')}</button></div>
    <div>
      <div class="card" style="margin-bottom:16px"><h3 style="margin-bottom:14px">${t('se.plan')}</h3>
        <div class="between" style="margin-bottom:12px"><span class="badge ${S.plan==='pro'?'pro':''}">${S.plan==='pro'?t('c.pro'):t('c.free')}</span><span class="small muted">${S.plan==='pro'?t('se.proActive'):t('se.freeActive')}</span></div>
        ${S.plan==='pro'?`<button class="btn danger block" onclick="S.plan='free';save();renderView();toast(t('t.proOff'))">${t('se.downgrade')}</button>`:`<button class="btn primary block" onclick="openPricing()">${t('se.upgrade')}</button>`}
        <div class="divider"></div><div class="tiny muted">${t('se.prices')}</div></div>
      <div class="card"><h3 style="margin-bottom:14px">${t('se.lang')}</h3><p class="small muted" style="margin-bottom:10px">${t('se.langD')}</p>${langSwitcher()}</div>
    </div>
  </div>
  <div class="card" style="margin-top:16px"><h3 style="margin-bottom:12px">${t('se.security')}</h3>
    <p class="small ${isSecure()?'muted':'bold'}">${isSecure()?('🔒 '+t('mo.secure')):('⚠️ '+t('mo.secureOff'))}</p>
    <p class="tiny dim" style="margin-top:8px">${location.origin&&location.origin!=='null'?esc(location.origin):''}</p>
  </div>
  <div class="card" style="margin-top:16px"><h3 style="margin-bottom:12px">${t('se.data')}</h3>
    <div class="row wrap"><button class="btn sm" onclick="exportData()">${t('se.export')}</button><button class="btn sm" onclick="seedDemo()">${t('se.demo')}</button><button class="btn sm danger" onclick="resetAll()">${t('se.erase')}</button></div>
    <p class="tiny dim" style="margin-top:10px">${t('se.note')}</p></div>`;
}
function saveProfile(){ S.name=$('#sName').value.trim()||S.name; S.area=$('#sArea').value.trim(); S.skill=$('#sSkill').value.trim(); save(); toast(t('t.saved')); renderView(); }
function exportData(){ const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='young-implacavel.json'; a.click(); toast(t('t.exported')); }
function seedDemo(){ const n=S.name,a=S.area,lg=S.lang,p=S.plan; S=seed(); S.name=n||'Jovem'; S.area=a; S.lang=lg; S.plan=p; S.loggedIn=true; S.onboarded=true; persist(); toast(t('t.demo')); }
function resetAll(){ if(!confirm(t('mo.eraseConfirm'))) return; localStorage.removeItem(LS); S=blank(); save(); $('#app').style.display='none'; renderLanding(); toast(t('t.erased')); }

/* ===================== boot ===================== */
save();
document.documentElement.lang=S.lang||'pt';
document.title=t('meta.title');
(function(){
  const md=document.querySelector('meta[name="description"]'); if(md) md.setAttribute('content',t('meta.desc'));
  if(S.loggedIn) showApp(); else renderLanding();
  window.addEventListener('beforeunload',save);
})();
</script>
</body>
</html>
